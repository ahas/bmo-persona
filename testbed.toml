# How the testbed tests and checks this repository, in the testbed's declaration format. The repository is
# content with its checks; it builds no binary and deploys no unit of its own (`docs/boundary.md`).

testbed = 0
name = "bmo-persona"

# The one Cargo package at the root, whose tests in `tests/` hold the content to `docs/format.md`.
[test]
languages = ["cargo"]

[check]
# The sweeps that read the tree before anything runs: the README's folder table, the dependencies the
# manifest names, Korean in the code and dashes in text for a person. The ledger is the Korean allowed per
# code file; it allows none. The content is no code and keeps its own language.
quick = ["layout", "dependencies", "korean", "dashes"]
korean_ledger = "korean-ledger.json"
# The repository depends on no other unit, the base libraries included.
base_libraries = []

[[check.step]]
id = "check"
command = "cargo check --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --check"
