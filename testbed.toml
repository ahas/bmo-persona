# How the testbed tests and checks this repository, in the testbed's declaration format. The repository is
# content with its installer and its checks; it deploys no unit of its own (`docs/boundary.md`).

testbed = 0
name = "bmo-persona"

# The one Cargo package at the root: the installer, and the tests in `tests/` that hold the content to
# `docs/format.md`.
[test]
languages = ["cargo"]

[check]
# The sweeps that read the tree before anything runs: the README's folder table, the dependencies the
# manifest names, letters that are not English in the code, and dashes in text for a person. The ledger
# is the lines holding such a letter allowed per code file, whether written as itself or named by an
# escape; it allows none. A code point is written as a number, which names no letter. The content is no
# code and keeps its own language.
quick = ["layout", "dependencies", "korean", "dashes", "cargo-profile"]
korean_ledger = "korean-ledger.json"
# The repository depends on no other unit, the base libraries included.
base_libraries = []

# No `[[check.step]]` is declared: the testbed's Cargo workspace check already runs `cargo fmt --check`
# and `cargo clippy --all-targets` and the change check runs `cargo check` for every crate a change marks,
# in the shared build folder, so a declared `sh -c` step would compile cold on every deployment and also
# run on deployments that touch no Rust.
